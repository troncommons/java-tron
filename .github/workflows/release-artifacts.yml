# This workflow downloads artifacts from AWS S3 that were previously uploaded by the sign-artifacts.yml workflow,
# and then uploads them to another AWS S3 bucket for release purposes.
# 
# Required inputs:
# - source-s3-path: The S3 path where signed artifacts are stored (e.g., v1.0.0-{YYYYMMDD-HHMMSS}-{7-characters-commit-hash}-plt-jdk-signed)
# 
# Optional inputs:
# - download-dir: Directory to download files to (default: ./downloads)
#
# Notes:
# - Target S3 bucket is retrieved from secrets.TARGET_S3_BUCKET
# - Target S3 path is set to be the same as source-s3-path
# - Different AWS credentials are used for source and target S3 buckets

name: Release - Signed Artifacts

on:
  workflow_dispatch:
    inputs:
      source-s3-path:
        description: 'Source S3 path for signed artifacts (e.g., v1.0.0-{YYYYMMDD-HHMMSS}-{7-characters-commit-hash}-plt-jdk-signed)'
        required: true
        type: string
      download-dir:
        description: 'Directory to download files to'
        required: false
        default: './downloads'
        type: string

jobs:
  validate-inputs:
    name: Validate Workflow Inputs
    runs-on: ubuntu-22.04
    steps:
      - name: Check source S3 path
        if: ${{ inputs.source-s3-path == '' }}
        run: |
          echo "Error: Source S3 path is required"
          exit 1

      - name: Check required secrets
        run: |
          if [[ -z "${{ secrets.TARGET_S3_BUCKET }}" ]]; then
            echo "Error: TARGET_S3_BUCKET secret is required"
            exit 1
          fi
          if [[ -z "${{ secrets.TARGET_AWS_REGION }}" ]]; then
            echo "Error: TARGET_AWS_REGION secret is required"
            exit 1
          fi
          if [[ -z "${{ secrets.TARGET_AWS_ACCESS_KEY_ID }}" ]]; then
            echo "Error: TARGET_AWS_ACCESS_KEY_ID secret is required"
            exit 1
          fi
          if [[ -z "${{ secrets.TARGET_AWS_SECRET_ACCESS_KEY }}" ]]; then
            echo "Error: TARGET_AWS_SECRET_ACCESS_KEY secret is required"
            exit 1
          fi

      - name: Inputs validation passed
        run: echo "All inputs and required secrets validated successfully"

  download-from-source-s3:
    name: Download from Source S3 - ${{ inputs.source-s3-path }}
    runs-on: ubuntu-22.04
    needs: validate-inputs

    # Define environment variables for reuse
    env:
      DOWNLOAD_DIR: ${{ inputs.download-dir }}

    permissions:
      contents: read
      id-token: write  # Needed for AWS credential provider

    steps:
    - name: Set S3 path
      run: |
        echo "SOURCE_S3_PATH=${{ secrets.AWS_S3_BUCKET }}/${{ inputs.source-s3-path }}" >> $GITHUB_ENV

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Create download directory
      run: mkdir -p ${{ env.DOWNLOAD_DIR }}

    - name: List files in source S3 bucket
      id: list-files
      run: |
        # Check if the S3 path exists
        if aws s3 ls "s3://${{ env.SOURCE_S3_PATH }}/" --recursive | grep -q .; then
          echo "Files found in s3://${{ env.SOURCE_S3_PATH }}/"
          aws s3 ls "s3://${{ env.SOURCE_S3_PATH }}/" --recursive
          echo "file_exists=true" >> $GITHUB_OUTPUT
        else
          echo "Error: No files found in s3://${{ env.SOURCE_S3_PATH }}/"
          echo "file_exists=false" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Download files from source S3
      if: steps.list-files.outputs.file_exists == 'true'
      run: |
        echo "Downloading files from s3://${{ env.SOURCE_S3_PATH }}/ to ${{ env.DOWNLOAD_DIR }}"
        aws s3 cp "s3://${{ env.SOURCE_S3_PATH }}/" "${{ env.DOWNLOAD_DIR }}/" --recursive

        # Verify download was successful
        if [ -z "$(ls -A ${{ env.DOWNLOAD_DIR }})" ]; then
          echo "Error: Failed to download files from S3"
          exit 1
        else
          echo "Download from S3 completed successfully"
          ls -la "${{ env.DOWNLOAD_DIR }}"
        fi

    - name: Create download summary
      run: |
        echo "## S3 Download Summary" >> $GITHUB_STEP_SUMMARY
        echo "Downloaded files from \`s3://${{ secrets.AWS_S3_BUCKET }}/${{ inputs.source-s3-path }}/\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Source S3 Path:** ${{ inputs.source-s3-path }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Downloaded Files:" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        ls -la "${{ env.DOWNLOAD_DIR }}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Upload downloaded files as artifacts (for record keeping)
      uses: actions/upload-artifact@v4
      with:
        name: release-files-${{ inputs.source-s3-path }}
        path: ${{ env.DOWNLOAD_DIR }}
        if-no-files-found: error

    - name: Configure AWS Credentials for Target
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.TARGET_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.TARGET_AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.TARGET_AWS_REGION }}

    - name: Upload directly to Target S3
      run: |
        echo "Uploading artifacts to s3://${{ secrets.TARGET_S3_BUCKET }}/${{ inputs.source-s3-path }}/"
        aws s3 cp "${{ env.DOWNLOAD_DIR }}/" "s3://${{ secrets.TARGET_S3_BUCKET }}/${{ inputs.source-s3-path }}/" --recursive

        # Verify upload was successful
        if aws s3 ls "s3://${{ secrets.TARGET_S3_BUCKET }}/${{ inputs.source-s3-path }}/" --recursive | grep -q .; then
          echo "Upload of artifacts to Target S3 completed successfully"

          # Create a list of uploaded files for the job summary
          echo "## Target S3 Upload Summary" >> $GITHUB_STEP_SUMMARY
          echo "Successfully uploaded files to \`s3://${{ secrets.TARGET_S3_BUCKET }}/${{ inputs.source-s3-path }}/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Source S3 Path:** ${{ inputs.source-s3-path }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target S3 Bucket:** ${{ secrets.TARGET_S3_BUCKET }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target S3 Path:** ${{ inputs.source-s3-path }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Uploaded Files:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          aws s3 ls "s3://${{ secrets.TARGET_S3_BUCKET }}/${{ inputs.source-s3-path }}/" --recursive >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "Error: Failed to verify files in Target S3 bucket after upload"
          echo "## Target S3 Upload Failed" >> $GITHUB_STEP_SUMMARY
          echo "Failed to verify files in \`s3://${{ secrets.TARGET_S3_BUCKET }}/${{ inputs.source-s3-path }}/\` after upload" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
